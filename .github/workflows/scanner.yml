name: TEA Scanner

on:
  schedule:
    # 20h Québec été (UTC-4)
    - cron: '0 0 * * *'

    # 20h Québec hiver (UTC-5)
    - cron: '0 1 * * *'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug current time
        run: |
          echo "UTC TIME:"
          date -u
          echo "LOCAL SERVER TIME:"
          date

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify secrets
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
import os

print('POLYGON_API_KEY exists:', bool(os.getenv('POLYGON_API_KEY')))
print('DISCORD_WEBHOOK_URL exists:', bool(os.getenv('DISCORD_WEBHOOK_URL')))
"

      - name: Run scanner
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "===================="
          echo "STARTING TEA SCANNER"
          echo "===================="

          python bot.py

          echo "===================="
          echo "SCANNER FINISHED"
          echo "===================="
